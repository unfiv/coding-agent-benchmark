services:
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    image: coding-agent-benchmark-cpp:latest
    container_name: agent_benchmark_cpp
    volumes:
      - ../..:/app
      # Forward promptfoo's database to the host so logs survive --rm
      - ./logs/promptfoo_data:/home/node/.promptfoo   # was /root/.promptfoo, but switched to the unprivileged node user (required by claude cli)
    working_dir: /app/benchmarks/cpp-gtest-fix
    env_file:
      - ../../.env        
    environment:
      - PROMPTFOO_DISABLE_TELEMETRY=true
      - PROMPTFOO_PYTHON=python3
    entrypoint: []
    # Single-command philosophy: auto-cache -> instant diff reset -> test.
    # promptfoo itself compares the models (multiple providers with different
    # label/config in promptfooconfig.yaml) - nothing here needs to change for
    # that; -o just writes the structured result, and bench_report.py folds it
    # into the console after promptfoo's table.
    command: bash -c "rm -f logs/results.json; ./setup.sh && ( [ -d workspace/googletest ] && git -C workspace/googletest reset --hard HEAD && git -C workspace/googletest clean -fd -e build ) && promptfoo eval --no-cache -o logs/results.json; python3 bench_report.py logs/results.json"```

