services:
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    image: coding-agent-benchmark-create-file:latest
    container_name: agent_benchmark_create_file
    volumes:
      # ONLY this benchmark's directory is mounted, not the whole repository:
      # the agent runs with --dangerously-skip-permissions and can delete or
      # overwrite everything it can see. The repo root (.git, .env, sibling
      # benchmarks, uncommitted work) never reaches the container.
      - .:/work
      # Forward promptfoo's database to the host so logs survive --rm
      - ./logs/promptfoo_data:/home/node/.promptfoo
    working_dir: /work
    env_file:
      - ../../.env
    environment:
      - PROMPTFOO_DISABLE_TELEMETRY=true
      - PROMPTFOO_PYTHON=python3
    entrypoint: []
    # There is no build step, so no setup.sh. Before starting, clean the workspace
    # and the old results.json (otherwise, if eval crashes, the report would show
    # someone else's run). Between eval and the report there is ";" rather than
    # "&&": as far as I know, promptfoo exits with code 100 if at least one
    # assertion fails, and with "&&" the report would not run exactly when it is
    # needed most. The container's exit code is the exit code of bench_report.py.
    command: bash -c "mkdir -p workspace logs && rm -f workspace/hello.txt logs/results.json && promptfoo eval --no-cache -o logs/results.json; python3 bench_report.py logs/results.json"