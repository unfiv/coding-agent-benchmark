prompts:
  - file://prompt.txt

# The toolset is NOT restricted - the model works as a black box, same as in the
# heavy cpp-gtest-fix test. The label is duplicated in config: that is where
# run_claude_code.py reads it from (it ends up in metadata.label for the report).
providers:
  - id: exec:python3 run_claude_code.py
    label: claude-sonnet-5
    config:
      label: claude-sonnet-5
      model: claude-sonnet-5
      maxTurns: 10
      maxBudgetUsd: 0.20
  # The second provider is just another entry. Haiku is used as the cheapest;
  # for comparison with the heavy test, claude-opus-5 can be put back.
  - id: exec:python3 run_claude_code.py
    label: claude-haiku-4-5
    config:
      label: claude-haiku-4-5
      model: claude-haiku-4-5-20251001
      maxTurns: 10
      maxBudgetUsd: 0.20

evaluateOptions:
  maxConcurrency: 1
  repeat: 10
  timeoutMs: 300000

tests:
  - assert:
      - type: python
        value: file://verify.py