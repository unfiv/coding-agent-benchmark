prompts:
  - file://prompt.txt

# Тулсет НЕ ограничиваем - модель работает как чёрный ящик, так же как в
# тяжёлом тесте cpp-gtest-fix. label дублируем в config: именно оттуда его
# читает run_claude_code.py (он попадает в metadata.label для отчёта).
providers:
  - id: exec:python3 run_claude_code.py
    label: claude-sonnet-5
    config:
      label: claude-sonnet-5
      model: claude-sonnet-5
      maxTurns: 10
      maxBudgetUsd: 0.20
  # Второй провайдер - просто ещё одна запись. Haiku взят как самый дешёвый;
  # для сравнения с тяжёлым тестом можно вернуть claude-opus-5.
  - id: exec:python3 run_claude_code.py
    label: claude-haiku-4-5
    config:
      label: claude-haiku-4-5
      model: claude-haiku-4-5-20251001
      maxTurns: 10
      maxBudgetUsd: 0.20

evaluateOptions:
  maxConcurrency: 1
  repeat: 10
  timeoutMs: 300000

tests:
  - assert:
      - type: python
        value: file://verify.py